# Add to ~/.codex/config.toml. Replace both <REPO> placeholders with the
# absolute Guildhall repository path; keep stdout reserved for MCP.
[mcp_servers.guildhall]
command = "node"
args = ["<REPO>/node_modules/tsx/dist/cli.mjs", "<REPO>/apps/guild-node/src/cli.ts", "--base-url", "http://127.0.0.1:5173"]
startup_timeout_sec = 20
tool_timeout_sec = 60
