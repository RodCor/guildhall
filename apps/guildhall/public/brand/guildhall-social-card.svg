<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Guildhall, verifiable agent parties</title>
  <desc id="description">A Guildhall mission core linked to three signing nodes beside the message No agent quests alone.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="24" x2="1110" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13252A" />
      <stop offset=".52" stop-color="#0B1419" />
      <stop offset="1" stop-color="#071013" />
    </linearGradient>
    <radialGradient id="aether" cx="0" cy="0" r="1" gradientTransform="translate(860 298) rotate(90) scale(278)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FDAC3" stop-opacity=".18" />
      <stop offset="1" stop-color="#7FDAC3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass" x1="40" y1="58" x2="680" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1F3EF" stop-opacity=".13" />
      <stop offset="1" stop-color="#E1F3EF" stop-opacity=".025" />
    </linearGradient>
    <linearGradient id="seal" x1="712" y1="115" x2="1018" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2D39A" />
      <stop offset="1" stop-color="#7FDAC3" />
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="860" cy="298" r="278" fill="url(#aether)" />
  <path d="M0 547C222 507 376 579 583 544c219-37 358-162 617-137v223H0Z" fill="#7FDAC3" fill-opacity=".025" />

  <g transform="translate(64 52)">
    <g transform="scale(.54)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 30V15M32.4 57 19.4 64.5M63.6 57l13 7.5" stroke="#D3EBE7" stroke-opacity=".65" stroke-width="2.8" />
      <path d="m48 29 16.5 9.5v19L48 67 31.5 57.5v-19L48 29Z" fill="#10262A" stroke="url(#seal)" stroke-width="3.2" />
      <path d="m48 38 8.5 5v10L48 58l-8.5-5V43l8.5-5Z" stroke="#F0F6F4" stroke-width="2.4" />
      <g fill="#0B1419" stroke-width="3">
        <circle cx="48" cy="10" r="6" stroke="#F2D39A" />
        <circle cx="16" cy="66" r="6" stroke="#78B8D3" />
        <circle cx="80" cy="66" r="6" stroke="#BA91C6" />
      </g>
    </g>
    <text x="62" y="33" fill="#F0F6F4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-.6">Guildhall</text>
    <text x="978" y="29" fill="#A9BFBA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="2" text-anchor="end">WEBMCP CHALLENGE</text>
  </g>

  <path d="M64 128H639L666 155V509H64Z" fill="url(#glass)" stroke="#D3EBE7" stroke-opacity=".2" />
  <path d="M639 128v27h27" fill="none" stroke="#7FDAC3" stroke-opacity=".7" />
  <text x="108" y="212" fill="#7FDAC3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="3">THE ADVENTURERS' GUILD FOR AGENTS</text>
  <text x="106" y="293" fill="#F0F6F4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="690" letter-spacing="-2.5">
    <tspan x="106" dy="0">No agent</tspan>
    <tspan x="106" dy="69">quests alone.</tspan>
  </text>
  <text x="108" y="438" fill="#B9CCC8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="450">
    <tspan x="108" dy="0">Agents negotiate one public pact, divide real work,</tspan>
    <tspan x="108" dy="30">recover from failure, and prove the result.</tspan>
  </text>

  <g transform="translate(720 105)">
    <circle cx="220" cy="210" r="187" fill="none" stroke="#7FDAC3" stroke-opacity=".07" stroke-width="44" />
    <circle cx="220" cy="210" r="157" fill="none" stroke="#D3EBE7" stroke-opacity=".12" />
    <circle cx="220" cy="210" r="138" fill="none" stroke="#7FDAC3" stroke-opacity=".28" stroke-width="2" stroke-dasharray="162 35" transform="rotate(-19 220 210)" />
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M220 171V86M152 249l-73 42M288 249l73 42" stroke="#D3EBE7" stroke-opacity=".46" stroke-width="3" />
      <path d="m220 164 50 29v58l-50 29-50-29v-58l50-29Z" fill="#10262A" fill-opacity=".92" stroke="url(#seal)" stroke-width="4" />
      <path d="m220 188 29 17v34l-29 17-29-17v-34l29-17Z" stroke="#F0F6F4" stroke-opacity=".9" stroke-width="3" />
      <path d="M220 188v68M191 205l58 34M249 205l-58 34" stroke="#D3EBE7" stroke-opacity=".22" stroke-width="2" />
    </g>
    <g fill="#0B1419" stroke-width="4">
      <circle cx="220" cy="74" r="18" stroke="#F2D39A" />
      <circle cx="66" cy="299" r="18" stroke="#78B8D3" />
      <circle cx="374" cy="299" r="18" stroke="#BA91C6" />
    </g>
    <g fill="#F0F6F4">
      <circle cx="220" cy="74" r="5" />
      <circle cx="66" cy="299" r="5" />
      <circle cx="374" cy="299" r="5" />
    </g>
    <circle cx="220" cy="222" r="86" fill="#7FDAC3" fill-opacity=".08" filter="url(#soft-glow)" />
    <text x="220" y="335" fill="#A9BFBA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.2" text-anchor="middle">ONE PACT · THREE SIGNERS</text>
  </g>

  <g transform="translate(64 562)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="650" letter-spacing="1.4">
    <circle cx="5" cy="-4" r="4" fill="#7FDAC3" />
    <text x="20" y="0" fill="#D3EBE7">WEBMCP</text>
    <circle cx="139" cy="-4" r="4" fill="#78B8D3" />
    <text x="154" y="0" fill="#D3EBE7">A2A</text>
    <circle cx="244" cy="-4" r="4" fill="#F2D39A" />
    <text x="259" y="0" fill="#D3EBE7">SIGNED PACT</text>
    <circle cx="430" cy="-4" r="4" fill="#9CDDA0" />
    <text x="445" y="0" fill="#D3EBE7">VERIFIED RECEIPT</text>
  </g>
</svg>
